<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>animation</title>
        <style>
           @keyframes bob{
           0% {transform: rotate(90deg);}
            50%{transform: rotate( 0deg);}
             100%{transform: rotate( -90deg);}
           }
           img{
            animation-name: bob;
            animation-duration: 1s;
            animation-iteration-count: infinite;
           }
        </style>
    </head>
    <body>
    <h2>어지러워요</h2>
    <h3><img src="media/spongebob.png"></h3>
    </body>
</html>
