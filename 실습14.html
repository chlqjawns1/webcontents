<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>animation</title>
        <style>
           img{
            transition:width 3s;
           }
           img:hover{
                width: 100%;
           }
        </style>
    </head>
    <body>
    <h2>마우스를올려봐요</h2>
    <img src="media/spongebob.png" width="150px">
    </body>
</html>
