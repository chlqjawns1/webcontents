<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>animation</title>
        <style>
           @keyframes bob{
            from{transform: rotate(0);}
            to{transform: rotate( 360deg);}
           }
           img{
            animation-name: bob;
            animation-duration: 1s;
            animation-iteration-count: infinite;
           }
        </style>
    </head>
    <body>
    <h2>어지러워요</h2>
    <h3><img src="media/spongebob.png"></h3>
    </body>
</html>
