<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>월화수목금토일</title>
    </head>
    <body>
        <h3>월화수목금토일</h3>
        <hr>
        <script>    
            let day=prompt("요일을 입력하세요");
            switch(day){
            case"월":
            case"화":
            case"수":
            case"목":
            document.write("출근");
            break;
            case"금":
            case"토":
            case"일":
            document.write("휴일"); 
            break;
            }
        </script>
    </body>
</html>
