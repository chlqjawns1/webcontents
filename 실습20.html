<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>do-while과break문</title>
    </head>
    <body>
        <h3>암호를 입력하라!</h3>
        <hr>
        <script>    
            let pass;
            while(true){
                pass=prompt("암호를대라");
                if(pass=="you"){
                    document.write("통과!")
                    break;
                }
            }
        </script>
    </body>
</html>
